;letter-spacing:-1px;text-align:center}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photoBox{border:1px dashed rgba(255,255,255,.25);border-radius:18px;min-height:160px;display:grid;place-items:center;background:rgba(255,255,255,.04);overflow:hidden}.photoBox img{width:100%;height:100%;object-fit:cover}.coachNote{border-left:4px solid var(--accent);padding:12px;background:rgba(125,211,252,.08);border-radius:0 16px 16px 0;line-height:1.4}.danger{color:#fecaca}.ok{color:#bbf7d0}.warn{color:#fde68a}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.prescription{grid-template-columns:repeat(3,1fr)}.formGrid{grid-template-columns:1fr 1fr}.heroTitle{font-size:29px}.actions{grid-template-columns:1fr}.card{padding:14px}.app{padding:14px 10px 0}}

<script>
const PLAN = {
Segunda:{title:"Costas A + Bíceps",goal:"Dorsais e bíceps",exercises:[["Puxada alta pronada — pegada média", "Costas", 3, "8–12", "90 s", "-", "-", "Cotovelos descem em direção às laterais do tronco; não puxe atrás da nuca."],["Pulldown unilateral na polia alta", "Costas", 3, "10–12/lado", "60 s", "-", "-", "Direcione o cotovelo ao quadril; não gire o tronco."],["Pullover na polia alta — barra reta", "Costas", 2, "12–15", "60 s", "-", "-", "Braços semiflexionados; evite compensar com a lombar."],["Remada articulada — pegada neutra", "Costas", 2, "10–12", "75 s", "-", "-", "Cotovelos próximos ao corpo."],["Rosca Scott máquina", "Bíceps", 3, "8–12", "75 s", "-", "-", "Não force extensão total dolorosa do cotovelo."],["Rosca martelo com corda", "Bíceps", 2, "10–12", "60 s", "-", "-", "Pegada neutra; substituir se provocar epicondilite."],["Cardio — esteira inclinada ou bicicleta", "Cardio", 1, "12 min", "-", "-", "-", "Esteira inclinada ou bicicleta."]]},
Terça:{title:"Peitoral + Tríceps",goal:"Peito e tríceps",exercises:[["Supino inclinado na máquina", "Peitoral", 3, "8–10", "120 s", "-", "-", "Principal exercício de progressão; ajuste banco e amplitude ao ombro."],["Chest press horizontal na máquina", "Peitoral", 2, "10–12", "90 s", "-", "-", "Controle a descida, sem projetar os ombros."],["Voador (peck deck)", "Peitoral", 3, "12–15", "60 s", "-", "-", "Amplitude confortável, sem exagerar no alongamento."],["Crossover baixo para alto", "Peitoral superior", 2, "12–15", "60 s", "-", "-", "Ênfase complementar no peitoral superior."],["Tríceps na polia com corda", "Tríceps", 3, "10–12", "60 s", "-", "-", "Cotovelos estáveis."],["Tríceps unilateral cruzado no cabo", "Tríceps", 2, "12–15/lado", "60 s", "-", "-", "Use trajetória confortável para o cotovelo."],["Cardio — bicicleta ou esteira", "Cardio", 1, "12 min", "-", "-", "-", "Bicicleta ou esteira."]]},
Quarta:{title:"Pernas completas + Abdômen",goal:"Pernas e abdômen",exercises:[["Hack squat", "Quadríceps", 3, "8–10", "120 s", "-", "-", "Amplitude segura e controlada."],["Leg press 45°", "Pernas", 2, "10–12", "90 s", "-", "-", "Não tire o quadril do encosto."],["Cadeira extensora", "Quadríceps", 2, "12–15", "60 s", "-", "-", "Controle o movimento."],["Mesa ou cadeira flexora", "Posteriores", 3, "10–12", "75 s", "-", "-", "Sem impulsos."],["Stiff com halteres", "Posteriores", 2, "8–10", "90 s", "-", "-", "Quadril para trás, coluna neutra."],["Panturrilha em pé", "Panturrilha", 3, "10–15", "60 s", "-", "-", "Pausa breve no alongamento."],["Panturrilha sentado", "Panturrilha", 2, "12–15", "60 s", "-", "-", "Movimento completo e controlado."],["Crunch na máquina", "Abdômen", 2, "12–15", "45 s", "-", "-", "Flexione o tronco, sem puxar com os braços."]]},
Quinta:{title:"Costas B + Bíceps + Antebraço",goal:"Costas, bíceps e antebraço",exercises:[["Remada baixa na polia — pegada neutra", "Costas", 3, "8–12", "90 s", "-", "-", "Puxe em direção ao abdômen; sem balanço excessivo."],["Puxada unilateral na máquina de puxada alta", "Costas", 2, "10–12/lado", "60 s", "-", "-", "Use alça individual e execução estável; se inviável, faça na polia."],["Remada articulada com apoio peitoral", "Costas", 2, "10–12", "75 s", "-", "-", "Mantenha o tórax apoiado."],["Rosca unilateral na polia", "Bíceps", 3, "10–12", "60 s", "-", "-", "Punho neutro e trajetória confortável."],["Rosca inclinada com halteres", "Bíceps", 2, "10–12", "75 s", "-", "-", "Substitua por cabo se houver dor."],["Extensão de punho leve ou isometria", "Antebraço", 2, "12–15", "45 s", "-", "-", "Somente se tolerado e compatível com orientação fisioterapêutica."],["Cardio — bicicleta", "Cardio", 1, "12 min", "-", "-", "-", "Bicicleta."]]},
Sexta:{title:"Ombros + Trapézio + Tríceps",goal:"Ombros, trapézio e tríceps",exercises:[["Elevação lateral com halteres", "Ombros", 3, "12–15", "60 s", "-", "-", "Braços ligeiramente à frente do tronco; sem impulsos."],["Desenvolvimento na máquina — pegada neutra", "Ombros", 2, "8–12", "90 s", "-", "-", "Somente se indolor; caso contrário, omitir."],["Elevação lateral unilateral no cabo", "Ombros", 2, "12–15/lado", "60 s", "-", "-", "Amplitude confortável e controle."],["Reverse pec deck", "Deltoide posterior", 3, "12–15", "60 s", "-", "-", "Ênfase em deltoide posterior."],["Encolhimento com halteres", "Trapézio", 2, "10–15", "60 s", "-", "-", "Eleve os ombros sem girá-los."],["Tríceps na polia — barra V", "Tríceps", 3, "10–12", "60 s", "-", "-", "Evite forçar o punho."],["Tríceps unilateral na polia", "Tríceps", 2, "12–15/lado", "60 s", "-", "-", "Sem dor no cotovelo."],["Cardio — esteira ou bicicleta", "Cardio", 1, "12 min", "-", "-", "-", "Esteira ou bicicleta."]]},
Sábado:{title:"Especialização V-Taper + Abdômen",goal:"V-Taper e abdômen",exercises:[["Pullover na polia alta — barra reta", "Costas", 2, "12–15", "60 s", "-", "-", "Foco em técnica, não em carga máxima."],["Remada unilateral ao quadril na polia", "Costas", 2, "12–15/lado", "60 s", "-", "-", "Cotovelo próximo ao corpo."],["Elevação lateral com halteres", "Ombros", 3, "15–20", "60 s", "-", "-", "Carga moderada, sem balanço."],["Supino inclinado na máquina", "Peitoral superior", 2, "10–12", "75 s", "-", "-", "Execução controlada."],["Rosca Scott máquina", "Bíceps", 2, "12–15", "60 s", "-", "-", "Sem forçar cotovelo."],["Crunch na máquina", "Abdômen", 3, "12–15", "45 s", "-", "-", "Controle da flexão abdominal."],["Prancha abdominal", "Abdômen", 2, "30–45 s", "45 s", "-", "-", "Respiração normal, tronco estável."],["Cardio — caminhada inclinada ou bicicleta", "Cardio", 1, "15 min", "-", "-", "-", "Caminhada inclinada ou bicicleta."]]},
Domingo:{title:"Descanso",goal:"Recuperação",exercises:[]}
};
const PERIOD = [['1','Adaptação','Retirar 1 série dos exercícios com 3 séries','Intensidade leve: RIR 3'],['2','Adaptação','Manter volume reduzido','RIR 2–3'],['3','Progressão','Aproximar do volume integral se recuperado','RIR 2'],['4','Deload','Cerca de metade das séries','RIR 4'],['5','Volume integral','Progressão de repetições e cargas','RIR 1–2'],['6','Volume integral','Progressão conforme tolerância','RIR 1–2'],['7','Volume integral','Progressão conforme tolerância','RIR 1–2'],['8','Deload','Cerca de metade das séries','RIR 4'],['9','Volume integral','Progressão de repetições e cargas','RIR 1–2'],['10','Volume integral','Progressão de repetições e cargas','RIR 1–2'],['11','Volume integral','Progressão de repetições e cargas','RIR 1–2'],['12','Deload e avaliação','Cerca de metade das séries','RIR 3–4']];
const LS='vtaper_coach_v2'; const state=JSON.parse(localStorage.getItem(LS)||'{}'); state.records ||= []; state.body ||= []; state.photos ||= {}; state.settings ||= {week:1}; state.settings.selectedWorkout ||= state.settings.workout || dayName(); state.completedWorkouts ||= []; state.seriesProgress ||= {}; state.protocol ||= {intervalDays:4,applications:[]}; state.protocol.applications ||= []; state.protocol.intervalDays ||= 4; state.settings.cycleStart ||= "2026-10-12"; state.settings.weekOffset ||= 0; state.weeklyBody ||= [];
function save(){localStorage.setItem(LS,JSON.stringify(state)); render();}
function dayName(){return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][new Date().getDay()]}
function ymd(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function yt(ex){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(ex+' proper form musculação')}
function allExercises(){return Object.values(PLAN).flatMap(d=>d.exercises).filter((v,i,a)=>a.findIndex(x=>x[0]===v[0])===i)}
function calculatedWeek(){const start=new Date(state.settings.cycleStart+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);return Math.max(1,Math.min(12,Math.floor((today-start)/604800000)+1))}
function currentWeek(){return Math.max(1,Math.min(12,calculatedWeek()+(state.settings.weekOffset||0)))}
function changeWeek(delta){state.settings.weekOffset=Math.max(-11,Math.min(11,(state.settings.weekOffset||0)+delta));state.settings.week=currentWeek();save()}
function resetWeek(){state.settings.weekOffset=0;state.settings.week=currentWeek();save()}
state.settings.week=currentWeek();
function doneToday(name,day){return state.records.some(r=>r.date===ymd()&&r.day===day&&r.exercise===name)}
function workoutDone(day){return state.completedWorkouts.some(w=>w.date===ymd()&&w.day===day)}
function lastRecord(name){return [...state.records].reverse().find(r=>r.exercise===name && (String(r.load||'').trim()!=='' || String(r.reps||'').trim()!==''))}
function seriesKey(day,name){return `${ymd()}|${day}|${name}`}
function getSeries(day,name){return Number(state.seriesProgress[seriesKey(day,name)]||0)}
function setSeries(day,name,n){state.seriesProgress[seriesKey(day,name)]=n; localStorage.setItem(LS,JSON.stringify(state))}
function addDaysISO(dateStr,days){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function fmtDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'-'}
function protocolLast(){return [...state.protocol.applications].sort((a,b)=>(b.date+String(b.ts)).localeCompare(a.date+String(a.ts)))[0]||null}
function protocolStatus(){const last=protocolLast();if(!last)return {kind:'warn',label:'Sem registro',next:null,days:null};const next=addDaysISO(last.date,Number(state.protocol.intervalDays)||4);const today=ymd();const days=Math.ceil((new Date(next+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);return {kind:days<0?'late':days===0?'due':days===1?'warn':'ok',label:days<0?`Atrasado ${Math.abs(days)} dia(s)`:days===0?'Aplicação prevista hoje':days===1?'Aplicação prevista amanhã':`Próxima em ${days} dias`,next,days,last}}
function parseRest(rest){const m=String(rest).match(/(\d+)/);return m?parseInt(m[1],10):60}

let audioCtx=null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function finishBeep(){
  try{
    ensureAudio();
    if(!audioCtx)return;
    const now=audioCtx.currentTime;
    [0,.18].forEach((delay,i)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='sine'; osc.frequency.setValueAtTime(i===0?880:1046,now+delay);
      gain.gain.setValueAtTime(.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(.18,now+delay+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.14);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(now+delay);osc.stop(now+delay+.16);
    });
  }catch(e){}
}
const restTimers={};
function startRest(idx,sec,totalSets,name){
  ensureAudio();
  const selected=state.settings.selectedWorkout||dayName(),key=seriesKey(selected,name);
  let current=getSeries(selected,name); if(current>=totalSets){current=0;setSeries(selected,name,0)}
  current++; setSeries(selected,name,current);
  const wrap=document.getElementById(`restWrap-${idx}`),btn=document.getElementById(`restBtn-${idx}`),series=document.getElementById(`series-${idx}`);
  if(!wrap||!btn)return;if(restTimers[key])clearInterval(restTimers[key]);
  const start=Date.now(),duration=sec*1000;
  wrap.classList.add('running');wrap.classList.remove('done');btn.disabled=true;
  const paint=()=>{const elapsed=Math.min(duration,Date.now()-start),progress=duration?elapsed/duration:1,r=Math.max(0,Math.ceil((duration-elapsed)/1000));
    wrap.style.setProperty('--progress',progress);btn.textContent=`Série ${current}/${totalSets} • ${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
    if(series)series.textContent=`Série ${current} de ${totalSets} registrada`;
    if(elapsed>=duration){clearInterval(restTimers[key]);delete restTimers[key];wrap.classList.remove('running');wrap.classList.add('done');wrap.style.setProperty('--progress',1);btn.disabled=false;btn.textContent=current>=totalSets?`Série ${current}/${totalSets} ✓`:`Próxima série • descanso concluído ✓`;finishBeep();navigator.vibrate?.([180,80,180])}};
  paint();restTimers[key]=setInterval(paint,250);
}
function renderMetrics(){const plan=PLAN[dayName()]||PLAN.Domingo; document.getElementById('todayPill').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}); document.getElementById('weekMetric').textContent=currentWeek(); document.getElementById('nextWorkoutMetric').textContent=plan.title.split('+')[0].trim(); document.getElementById('recordsMetric').textContent=state.records.length; const days=new Set(state.records.map(r=>r.date)).size; document.getElementById('adherenceMetric').textContent=Math.min(100,Math.round(days/72*100))+'%'}
function renderHome(){const latestBody=state.body.at(-1)||{}; const today=dayName(); const plan=PLAN[today]; document.getElementById('home').innerHTML=`
  <div class="card"><div class="row"><div><h2>Plano da semana ${state.settings.week}</h2><p class="muted">${PERIOD[state.settings.week-1]?.[1]||''} • ${PERIOD[state.settings.week-1]?.[2]||''}</p></div><div class="weekControls"><button class="btn secondary weekTiny" onclick="changeWeek(-1)">−</button><button class="btn secondary weekTiny" onclick="changeWeek(1)">+</button><button class="btn secondary weekTiny" onclick="resetWeek()">Auto</button></div></div><div class="bar"><i style="width:${Math.round(state.settings.week/12*100)}%"></i></div></div>
  <div class="card"><h2>Treino de hoje — ${today}</h2><p class="muted">${plan.title} — ${plan.goal}</p><button class="btn" onclick="state.settings.selectedWorkout='${today}';save();showView('workout')">Abrir treino de hoje</button></div>
  <div class="grid"><div class="metric"><b>${latestBody.peso||'-'}</b><span>Peso</span></div><div class="metric"><b>${latestBody.cintura||'-'}</b><span>Cintura</span></div><div class="metric"><b>${latestBody.bracoD||'-'}</b><span>Braço D</span></div><div class="metric"><b>${new Set(state.records.map(r=>r.date)).size}</b><span>Dias com treino</span></div></div>
  ${(()=>{const p=protocolStatus();return `<div class="card ${p.kind==='late'?'protocolLate':p.kind==='due'?'protocolDue':p.kind==='warn'?'protocolWarn':''}"><div class="row"><div><h2>Reposição hormonal</h2><p class="muted">${p.label}${p.next?` • ${fmtDate(p.next)}`:''}</p></div><button class="btn secondary" onclick="showView('protocol')">Abrir</button></div></div>`})()}
<div class="card"><h2>Periodização</h2><div class="list">${PERIOD.map(p=>`<div class="libraryItem"><b>Semana ${p[0]} — ${p[1]}</b><p class="muted">${p[2]} • ${p[3]}</p></div>`).join('')}</div></div>`}
function effectiveSets(ex){const base=Number(ex[2])||1;if(ex[1]==='Cardio')return base;const w=currentWeek();if(w===1||w===2)return base===3?2:base;if([4,8,12].includes(w))return Math.max(1,Math.ceil(base/2));return base}
function exerciseCard(ex,idx){const [name,target,sets,reps,rest,cad,rir,obs]=ex; const selected=state.settings.selectedWorkout||dayName(); const last=lastRecord(name); const done=doneToday(name,selected); const sDone=getSeries(selected,name); const totalSets=effectiveSets(ex);
  if(done){const todayRec=[...state.records].reverse().find(r=>r.date===ymd()&&r.day===selected&&r.exercise===name); return `<div class="exercise done"><div class="doneCompact"><div class="doneInfo"><div class="exName"><a target="_blank" href="${yt(name)}">✓ ${idx+1}. ${esc(name)}</a></div><span class="tag ok">concluído</span><p class="muted">${todayRec?.load||'-'} kg • ${todayRec?.reps||'-'} reps • ${Math.min(sDone,totalSets)}/${totalSets} séries</p></div><div class="doneActions"><a class="btn secondary" target="_blank" href="${yt(name)}">Vídeo</a><button class="btn secondary" onclick="undoExercise('${encodeURIComponent(name)}')">Reabrir</button></div></div></div>`}
  const safeName=name.replace(/'/g,"&#39;");
  return `<div class="exercise"><div class="exHead"><div><div class="exName"><a target="_blank" href="${yt(name)}">${idx+1}. ${esc(name)}</a></div><span class="tag">${esc(target)}</span></div><a class="btn secondary" target="_blank" href="${yt(name)}">Vídeo</a></div><div class="prescription"><div class="mini"><b>${totalSets}</b><span>Séries</span></div><div class="mini"><b>${reps}</b><span>Reps</span></div><div class="mini"><b>${rest}</b><span>Desc.</span></div><div class="mini"><b>${cad}</b><span>Cad.</span></div></div><p class="muted">${esc(obs)}</p><p class="muted">Último preenchido: ${last?`${last.load||'-'} kg • ${last.reps||'-'} reps`:'sem registro'}</p><div class="formGrid"><input id="load-${idx}" inputmode="decimal" placeholder="Carga kg" value="${last?.load||''}"><input id="reps-${idx}" inputmode="numeric" placeholder="Reps feitas" value="${last?.reps||''}"></div><textarea id="note-${idx}" rows="2" placeholder="Observação rápida" style="margin-top:9px"></textarea><div class="actions"><button class="btn good" onclick="completeExercise(${idx})">Concluir exercício</button><div><div class="restWrap" id="restWrap-${idx}" style="--progress:0"><button class="btn secondary" id="restBtn-${idx}" onclick="startRest(${idx},${parseRest(rest)},${totalSets},'${safeName}')">${sDone?`Próxima série • ${sDone}/${totalSets}`:`Descanso ${rest}`}</button></div><div class="seriesLine" id="series-${idx}">${sDone?`Série ${sDone} de ${totalSets} registrada`:'Nenhuma série registrada'}</div></div></div></div>`}
function undoExercise(encodedName){const selected=state.settings.selectedWorkout||dayName(); const name=decodeURIComponent(encodedName); for(let i=state.records.length-1;i>=0;i--){const r=state.records[i]; if(r.date===ymd()&&r.day===selected&&r.exercise===name){state.records.splice(i,1);break}} save()}
function renderWorkout(){const selected=state.settings.selectedWorkout||dayName(); const plan=PLAN[selected]; const completed=workoutDone(selected); const doneCount=plan.exercises.filter(e=>doneToday(e[0],selected)).length; const completionBlock=plan.exercises.length?`${completed?`<div class="card workoutComplete"><div class="row"><div><h2>✓ Treino concluído</h2><p class="muted">O treino de ${selected} foi marcado como concluído hoje.</p></div><button class="btn secondary" onclick="undoWorkout()">Desfazer</button></div></div>`:`<div class="card"><h2>Finalizar sessão</h2><p class="muted">${doneCount} de ${plan.exercises.length} exercícios concluídos.</p><button class="btn good" style="width:100%" onclick="completeWorkout()">Concluir treino</button></div>`}`:''; document.getElementById('workout').innerHTML=`<div class="card"><h2>Escolha o treino</h2><select class="select" onchange="state.settings.selectedWorkout=this.value;save()">${Object.keys(PLAN).map(d=>`<option value="${d}" ${d===selected?'selected':''}>${d} — ${PLAN[d].title}</option>`).join('')}</select><p class="muted" style="margin-bottom:0">Você pode selecionar qualquer treino, mesmo que não corresponda ao dia atual.</p></div><div class="card"><h2>${selected} — ${plan.title}</h2><p class="muted">${plan.goal}</p><div class="bar"><i style="width:${plan.exercises.length?Math.round(doneCount/plan.exercises.length*100):100}%"></i></div><p class="muted" style="margin-bottom:0">${doneCount} de ${plan.exercises.length} exercícios concluídos</p></div>${plan.exercises.length?plan.exercises.map(exerciseCard).join(''):`<div class="card"><h2>Descanso</h2><p class="muted">Priorize sono, hidratação, mobilidade leve e recuperação.</p></div>`}${completionBlock}`}
function completeWorkout(){const selected=state.settings.selectedWorkout||dayName(); if(!workoutDone(selected)) state.completedWorkouts.push({date:ymd(),day:selected,ts:Date.now()}); save()}
function undoWorkout(){const selected=state.settings.selectedWorkout||dayName(); state.completedWorkouts=state.completedWorkouts.filter(w=>!(w.date===ymd()&&w.day===selected)); save()}
function completeExercise(idx){const selected=state.settings.selectedWorkout||dayName(); const ex=PLAN[selected].exercises[idx]; if(doneToday(ex[0],selected)) return; const rec={date:ymd(),day:selected,exercise:ex[0],target:ex[1],sets:effectiveSets(ex),plannedReps:ex[3],load:document.getElementById(`load-${idx}`).value,reps:document.getElementById(`reps-${idx}`).value,note:document.getElementById(`note-${idx}`).value,seriesDone:getSeries(selected,ex[0]),ts:Date.now()}; state.records.push(rec); localStorage.setItem(LS,JSON.stringify(state)); render();}
function renderLibrary(){document.getElementById('library').innerHTML=`<div class="card"><h2>Biblioteca de exercícios</h2><p class="muted">Toque em “Vídeo” para abrir uma busca no YouTube com execução correta.</p></div><div class="tabs">${Object.keys(PLAN).filter(d=>PLAN[d].exercises.length).map(d=>`<button class="tab" onclick="state.settings.selectedWorkout='${d}';save();showView('workout')">${d}</button>`).join('')}</div><div class="list">${allExercises().map(ex=>`<div class="libraryItem"><div class="row"><div><b>${esc(ex[0])}</b><p class="muted">${esc(ex[1])} • ${effectiveSets(ex)} séries • ${ex[3]} reps</p></div><a class="btn secondary" target="_blank" href="${yt(ex[0])}">Vídeo</a></div><p class="muted">${esc(ex[7])}</p></div>`).join('')}</div>`}
function renderBody(){const week=currentWeek(),old=state.weeklyBody.find(x=>x.cycleStart===state.settings.cycleStart&&x.week===week)||{};document.getElementById('body').innerHTML=`<div class="card"><h2>Registro de acompanhamento</h2><p class="muted">Novo ciclo iniciado em 12/10/2026 • um registro por semana. Você pode atualizar o registro da mesma semana.</p><div class="bodyField"><label>Semana do programa</label><select id="bodyWeek" onchange="renderBodyWeek(Number(this.value))">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>Semana ${i+1}</option>`).join('')}</select></div><div id="bodyForm">${bodyFields(old)}</div></div><div class="card"><h2>Histórico semanal</h2>${state.weeklyBody.filter(x=>x.cycleStart===state.settings.cycleStart).slice().sort((a,b)=>b.week-a.week).map(b=>`<div class="libraryItem"><b>Semana ${b.week} • ${fmtDate(b.date)}</b><p class="muted">Peso ${esc(b.peso||'-')} kg • Cintura ${esc(b.cintura||'-')} cm • Sono ${esc(b.sono||'-')} h • Dor ${esc(b.dor||'-')}/10</p>${b.photo?`<img class="photoThumb" src="${b.photo}" alt="Foto da semana ${b.week}">`:''}</div>`).join('')||'<p class="muted">Nenhum registro do novo ciclo.</p>'}</div>`}
function bodyFields(b){return `<div class="formGrid" style="margin-top:12px"><div class="bodyField"><label>Peso (kg)</label><input id="peso" inputmode="decimal" value="${esc(b.peso||'')}" placeholder="Ex.: 83,4"></div><div class="bodyField"><label>Cintura (cm)</label><input id="cintura" inputmode="decimal" value="${esc(b.cintura||'')}" placeholder="Ex.: 89"></div><div class="bodyField"><label>Sono médio (h)</label><input id="sono" inputmode="decimal" value="${esc(b.sono||'')}" placeholder="Ex.: 6"></div><div class="bodyField"><label>Dor articular (0–10)</label><input id="dor" type="range" min="0" max="10" value="${esc(b.dor??0)}" oninput="document.getElementById('dorValue').textContent=this.value"><span id="dorValue">${esc(b.dor??0)}</span></div></div><div class="bodyField" style="margin-top:12px"><label>Observações</label><textarea id="ajuste" rows="2">${esc(b.ajuste||'')}</textarea></div><div class="bodyField" style="margin-top:12px"><label>Foto opcional (armazenada neste aparelho)</label><input id="weeklyPhoto" type="file" accept="image/*"><small class="muted">Fotos grandes serão reduzidas para economizar espaço.</small></div>${b.photo?`<img class="photoThumb" src="${b.photo}" alt="Foto atual">`:''}<button class="btn" style="margin-top:12px" onclick="addBody()">Salvar semana</button>`}
function renderBodyWeek(week){const b=state.weeklyBody.find(x=>x.cycleStart===state.settings.cycleStart&&x.week===week)||{};document.getElementById('bodyForm').innerHTML=bodyFields(b)}
async function photoData(file){if(!file)return null;return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const canvas=document.createElement('canvas'),ratio=Math.min(1,900/Math.max(img.width,img.height));canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.65))};img.onerror=reject;img.src=url})}
async function addBody(){const week=Number(val('bodyWeek'));const previous=state.weeklyBody.find(x=>x.cycleStart===state.settings.cycleStart&&x.week===week);const file=document.getElementById('weeklyPhoto').files[0];let photo=previous?.photo||null;if(file){try{photo=await photoData(file)}catch(e){alert('Não foi possível ler a foto.');return}}const record={cycleStart:state.settings.cycleStart,week,date:ymd(),peso:val('peso'),cintura:val('cintura'),sono:val('sono'),dor:val('dor'),ajuste:val('ajuste'),photo};const arr=state.weeklyBody.filter(x=>!(x.cycleStart===record.cycleStart&&x.week===week));arr.push(record);state.weeklyBody=arr;try{save()}catch(e){state.weeklyBody=arr.filter(x=>x!==record);alert('Armazenamento cheio. Tente uma foto menor ou sem foto.')}}
function val(id){return document.getElementById(id).value}
function loadPhoto(ev,key){const file=ev.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{state.photos[key]=r.result;save()}; r.readAsDataURL(file)}
function renderCoach(){const today=state.records.filter(r=>r.date===ymd()); const pain=Number(state.body.at(-1)?.dor||0); const notes=[]; if(pain>3) notes.push('<span class="danger">Dor no cotovelo acima de 3/10: reduza carga, ajuste pegada, use straps em costas e prefira cabos/máquinas.</span>'); if(today.length===0) notes.push('Nenhum exercício registrado hoje. Comece pelo treino do dia e registre carga/reps para gerar histórico.'); else notes.push(`<span class="ok">Você já registrou ${today.length} exercício(s) hoje. Continue respeitando descanso e técnica.</span>`); const byEx={}; state.records.forEach(r=>{byEx[r.exercise] ||= []; byEx[r.exercise].push(r)}); const progress=Object.entries(byEx).map(([ex,arr])=>{const last=[...arr].reverse().find(r=>String(r.load||'').trim()!==''||String(r.reps||'').trim()!=='')||arr.at(-1); return `<div class="libraryItem"><b>${esc(ex)}</b><p class="muted">Último preenchido: ${last.load||'-'} kg • ${last.reps||'-'} reps</p></div>`}).join(''); document.getElementById('coach').innerHTML=`<div class="card"><h2>Coach local</h2>${notes.map(n=>`<div class="coachNote">${n}</div>`).join('<br>')}<div class="coachNote" style="margin-top:12px">Regra de progressão: quando alcançar o topo da faixa de repetições em todas as séries com técnica limpa, considere aumentar a carga na próxima sessão conforme seu planejamento.</div></div><div class="card"><h2>Histórico de treino</h2><div class="list">${progress||'<p class="muted">Sem registros ainda.</p>'}</div></div><div class="card"><h2>Exportar dados</h2><button class="btn secondary" onclick="exportData()">Baixar backup JSON</button><label class="btn secondary" style="margin-left:8px">Restaurar backup<input type="file" accept="application/json,.json" hidden onchange="importData(event)"></label><button class="btn secondary" style="margin-left:8px" onclick="if(confirm('Apagar todos os dados salvos neste aparelho?')){localStorage.removeItem(LS);location.reload()}">Limpar dados</button></div>`}
function renderProtocol(){const p=protocolStatus(); const apps=[...state.protocol.applications].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts); document.getElementById('protocol').innerHTML=`
<div class="card ${p.kind==='late'?'protocolLate':p.kind==='due'?'protocolDue':p.kind==='warn'?'protocolWarn':''}"><h2>Controle da reposição hormonal</h2><p class="muted">Registro do esquema prescrito pelo seu médico. O app não altera doses nem intervalos.</p><div class="grid"><div class="metric"><b>${p.last?fmtDate(p.last.date):'-'}</b><span>Última aplicação</span></div><div class="metric"><b>${p.next?fmtDate(p.next):'-'}</b><span>Próxima prevista</span></div><div class="metric"><b>${state.protocol.intervalDays}</b><span>Intervalo em dias</span></div><div class="metric"><b>${p.label}</b><span>Status</span></div></div></div>
<div class="card"><h2>Registrar aplicação</h2><div class="formGrid"><input id="protocolDate" type="date" value="${ymd()}"><input id="protocolInterval" type="number" min="1" value="${state.protocol.intervalDays}" placeholder="Intervalo (dias)"></div><textarea id="protocolItems" rows="3" placeholder="Medicamento(s) / composto(s) e dose(s), exatamente como prescritos" style="margin-top:9px"></textarea><textarea id="protocolNote" rows="2" placeholder="Observação opcional" style="margin-top:9px"></textarea><button class="btn good" style="margin-top:10px;width:100%" onclick="addProtocolApplication()">Registrar aplicação</button></div>
<div class="card"><h2>Histórico de aplicações</h2><div class="list">${apps.map(a=>`<div class="libraryItem"><div class="row"><div><b>${fmtDate(a.date)}</b><p class="muted">${esc(a.items||'Sem descrição')}</p><p class="small">${esc(a.note||'')}</p></div><button class="btn secondary" onclick="deleteProtocol(${a.ts})">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhuma aplicação registrada.</p>'}</div></div>
<div class="card"><p class="muted small">O lembrete aparece no V‑Taper quando o app é aberto. Navegadores/PWAs podem não entregar alertas programados com o app fechado.</p></div>`}
function addProtocolApplication(){const date=val('protocolDate'),items=val('protocolItems').trim(),note=val('protocolNote').trim(),interval=Number(val('protocolInterval'))||4;if(!date){alert('Informe a data da aplicação.');return}state.protocol.intervalDays=interval;state.protocol.applications.push({date,items,note,ts:Date.now()});save()}
function deleteProtocol(ts){if(confirm('Excluir este registro de aplicação?')){state.protocol.applications=state.protocol.applications.filter(a=>a.ts!==ts);save()}}

async function importData(ev){const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.records)||!Array.isArray(data.body)||!data.settings||!data.protocol||!Array.isArray(data.protocol.applications))throw Error('Arquivo incompatível');if(!confirm('Restaurar este backup substituirá os registros atuais deste aparelho. Continuar?'))return;localStorage.setItem(LS,JSON.stringify(data));location.reload()}catch(e){alert('Não foi possível restaurar: '+e.message)}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vtaper-backup.json'; a.click();}
function showView(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id)); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id)); window.scrollTo({top:0,behavior:'smooth'}); render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function render(){renderMetrics(); renderHome(); renderWorkout(); renderLibrary(); renderBody(); renderCoach(); renderProtocol()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
</script>
</body>
